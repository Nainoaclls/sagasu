<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Offline · Sagasu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F5F5;
             color: #1E2F36; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 420px; padding: 2rem; }
      img { width: 96px; height: 96px; }
      h1 { color: #326273; font-size: 1.5rem; margin: 1rem 0 .5rem; }
      p { color: #4F6470; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; background: #326273; color: #fff; font-weight: 700;
          padding: .75rem 1.5rem; border-radius: .5rem; text-decoration: none; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="">
      <h1>You are offline</h1>
      <p>Sagasu needs a connection to load this page. Pages you already visited may still be available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
