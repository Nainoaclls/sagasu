      actions: "サプライヤーに連絡"
      mailto: "メールアプリで開く"
      mailto_unavailable: "メールボタンを使うには、サプライヤー情報にメールアドレスを登録してください。"
      no_email: "メールアドレス未登録 — 別の方法で連絡してください。"
      approval_pdf: "承認書（PDF）"
      mark_sent: "送信済みにする"
    flash:
      sent: "%{name} を連絡済みにしました。"
    project:
      link: "サプライヤーに連絡（見積依頼）"
