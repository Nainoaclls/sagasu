# Mirrors config/ci.rb (bin/ci): style, security audits, then the test suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Style and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (version from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop --format github

      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Gem audit
        run: bin/bundler-audit

      - name: Importmap audit
        run: bin/importmap audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      # Tests force SAGASU_AI_DISABLED=1 themselves; no OpenAI key is ever needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (version from .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run the tests
        run: bin/rails test

      - name: Check that the seeds still load
        run: bin/rails db:seed:replant
